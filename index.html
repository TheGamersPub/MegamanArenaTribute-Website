<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Megaman Arena Tribute</title>
    <link rel="icon" href="./build/index.icon.png" />
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <div id="left">
      <div class="row">
        <h1>Megaman Arena Tribute</h1>
        <span id="gameState">carregando...</span>
        <button id="fullscreenBtn" title="Tela cheia (Esc para sair)">
          <img src="./assets/fullscreen.png" alt="Tela cheia" />
        </button>
        <button id="reloadBtn">Recarregar</button>
      </div>
      <div id="gameHost">
        <iframe
          id="game-frame"
          src="./build/index.html"
          title="Megaman Arena Tribute"
          allow="fullscreen; autoplay; gamepad; loopback-network; local-network"
        ></iframe>
      </div>
    </div>

    <div id="right">
      <section>
        <h2>Debug — Console do jogo</h2>
        <div class="row" style="justify-content: space-between; margin-bottom: 6px">
          <label class="switch" title="Exibe logs no painel (pode custar FPS)">
            <input type="checkbox" id="consoleCapture" checked />
            Capturar console
          </label>
          <button id="copyConsoleBtn">Copiar console</button>
        </div>
        <div id="console"></div>
      </section>

      <section>
        <h2>Dados do Jogo</h2>
        <div class="row">
          <div id="stats"></div>
        </div>
      </section>

      <section>
        <h2>Tráfego</h2>
        <div id="log"></div>
      </section>
    </div>

    <script src="./assets/app.js"></script>
  </body>
</html>
